[package]
name = "aura"
version = "0.1.3-beta.2"
description = "A considered space for your Windows desktop widgets"
authors = ["Aura contributors"]
license = "MIT"
repository = "https://github.com/ujjwaluzu/aura"
edition = "2021"
rust-version = "1.99"
publish = false

[lib]
name = "aura_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[features]
# Developer builds only; never enables account access in release builds.
music-validation = []

[target.'cfg(windows)'.dependencies]
# 2.7's auto-launch 0.6 backend uses Dynamic scope and unquoted paths.
# Keep registration limited to the current user. Aura quotes the saved path.
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-single-instance = "2.5.5"
winreg = "0.10"
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Security_Cryptography", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
