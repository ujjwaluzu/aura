name: Windows verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_candidate:
        description: Build and attach an unsigned Windows testing candidate
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
      - name: Install pinned package manager
        run: npm install --global pnpm@11.15.1
      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target x86_64-pc-windows-msvc
          rustup default 1.99.1-x86_64-pc-windows-msvc
      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: Install Rust advisory scanner
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Verify source
        run: pnpm verify
      - name: Build Windows release candidate
        if: github.event_name == 'workflow_dispatch' && inputs.build_candidate
        run: pnpm release:candidate --reuse-verification
      - name: Upload verification record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-verification-${{ github.run_id }}
          path: artifacts/release-checks/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload unsigned testing candidate
        if: github.event_name == 'workflow_dispatch' && inputs.build_candidate && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aura-windows-release-candidate-${{ github.run_id }}
          path: artifacts/release-candidate/
          if-no-files-found: error
          retention-days: 14
